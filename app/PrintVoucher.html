<!DOCTYPE html>
<html>

<head>
    <style>
        .voucher {
            border: 1px solid #ccc;
            padding: 10px;
            width: 250px;
            font-family: Arial, sans-serif;
            text-align: center;
            float: left;
            background-image: url("./img/voucher_logo.png");
            background-size: cover;
            background-position: center;
        }

        .voucher-title {
            font-size: 14px;
        }

        .voucher-code {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            font-family: 'Consolas';
        }

        .voucher-details {
            font-size: 12px;
            /* color: #666666; */
            color: #4a4a4a
        }

        .voucher-footer {
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div id="vouchers-container"></div>
    
    <script>
        // Function to pad a string with leading zeroes
        function padWithZeroes(code, desiredLength) {
            while (code.length < desiredLength) {
                code = "0" + code;
            }
            return code;
        }
    
        // Fetch function with cache-busting
        function fetchVoucherList(filePath) {
            // Add a cache-busting query parameter with a unique timestamp
            const cacheBustedUrl = `${filePath}?nocache=${new Date().getTime()}`;

            return fetch(cacheBustedUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Failed to fetch ${filePath}`);
                    }
                    return response.text(); // Assuming the CSV is text-based
                });
        }
    
        // Function to check if an image exists with cache-busting
        function imageExists(url) {
            const cacheBustedUrl = `${url}?nocache=${new Date().getTime()}`;
            return fetch(cacheBustedUrl, { method: 'HEAD' })
                .then(response => response.ok)
                .catch(() => false);
        }

        // Function to create a DOM element with text content
        function createElement(tag, className, textContent = "") {
            const element = document.createElement(tag);
            if (className) element.classList.add(className);
            if (textContent) element.textContent = textContent;
            return element;
        }

        // Fetch the CSV file from the root folder
        fetchVoucherList("VoucherList.csv")
            .catch(() => {
                // If "VoucherList.csv" is not found in the root folder, try to fetch from the "raw_csv" folder
                return fetchVoucherList("./raw_csv/VoucherList.csv");
            })
            .then(csvData => {
                // Fetch the voucher code length from "put_vcodlen_here.txt"
                return fetch("put_vcodlen_here.txt")
                    .then(response => {
                        if (!response.ok) {
                            throw new Error("put_vcodlen_here.txt file not found");
                        }
                        return response.text();
                    })
                    .then(vcodeLengthStr => {
                        // Parse the voucher code length and return both CSV data and length
                        return { csvData, vcodeLength: parseInt(vcodeLengthStr.trim()) };
                    });
            })
            .then(({ csvData, vcodeLength }) => {
                // Split the CSV data into rows
                const rows = csvData.split("\n");

                // Extract headers from the first row
                const headers = rows[0].split(",");
                const neededHeaders = ['Code', 'Price', 'Notes', 'Duration', 'Type', 'Portals'];

                // Find the indices of the headers that are required
                const neededIndices = neededHeaders.map(header => headers.indexOf(header)).filter(index => index !== -1);

                // Check for valid printable vouchers
                const hasPrintableVouchers = rows.slice(1).some(row => {
                    const columns = row.split(",");
                    const data = {};

                    // Extract only the necessary columns based on needed headers
                    neededHeaders.forEach((header, i) => {
                        data[header] = columns[neededIndices[i]]?.replace(/"/g, "") || "";
                    });

                    // Determine if the row meets the criteria
                    return data['Notes'] === "PRINT VOUCHER" && data['Type'] !== "Expired";
                });

                // Prompt if no printable vouchers exist
                if (!hasPrintableVouchers) {
                    alert("VoucherList.csv is empty or contains no printable vouchers.");
                    return; // Exit early
                }

                // Get the container element where vouchers will be displayed
                const vouchersContainer = document.getElementById("vouchers-container");

                // Map to store price and corresponding background image filenames
                const priceImageMap = {};

                // Loop through each row, starting from the second row (data rows)
                rows.slice(1).forEach(row => {
                    const columns = row.split(",");
                    const data = {};

                    // Extract only the necessary columns based on needed headers
                    neededHeaders.forEach((header, i) => {
                        data[header] = columns[neededIndices[i]]?.replace(/"/g, "") || "";
                    });

                    // Check if the voucher meets the criteria to be displayed
                    if (data['Notes'] === "PRINT VOUCHER" && data['Type'] !== "Expired") {
                        // Assign a unique background image to each price if not already mapped
                        if (!(data['Price'] in priceImageMap)) {
                            priceImageMap[data['Price']] = `vlogo${Object.keys(priceImageMap).length + 1}.png`;
                        }

                        // Create the voucher element
                        const voucher = createElement("div", "voucher");

                        // Dynamically set the background image for the voucher based on the price
                        if (data['Price'] in priceImageMap) {
                            const imagePath = `./img/vlogo/${priceImageMap[data['Price']]}`;
                            imageExists(imagePath).then(exists => {
                                if (exists) {
                                    const cacheBustedUrl = `${imagePath}?nocache=${new Date().getTime()}`;
                                    voucher.style.backgroundImage = `url(${imagePath})`;
                                }
                            });
                        }

                        // Add title showing the price of the voucher
                        voucher.appendChild(createElement("div", "voucher-title", `${data['Price'].replace("PHP", "₱")} Voucher`));

                        // Add the voucher code, padded with leading zeroes if necessary
                        voucher.appendChild(createElement("div", "voucher-code", padWithZeroes(data['Code'], vcodeLength)));

                        // Add details about the duration
                        let durationText = data['Duration'] ? data['Duration'].replace(".0", " ") : "";

                        // Handle durations divisible by 24 hours
                        if (durationText.endsWith("Hours") && parseInt(durationText) % 24 === 0) {
                            durationText = `${parseInt(durationText) / 24} Days`;
                        }

                        voucher.appendChild(createElement("div", "voucher-details", `Duration: ${durationText}`));

                        // Add details about the type of voucher
                        voucher.appendChild(createElement("div", "voucher-details", `Type: Valid for ${data['Type'].replace(/\D/g, '')} User(s)`));

                        // Add WiFi name details
                        const wifiNameSpan = createElement("span", "", "WiFi Name: ");
                        const ssidStrong = createElement("strong", "", data['Portals'].replace("[", "").replace("]", ""));
                        wifiNameSpan.appendChild(ssidStrong);
                        const wifiDetails = createElement("div", "voucher-details");
                        wifiDetails.appendChild(wifiNameSpan);
                        voucher.appendChild(wifiDetails);

                        // Append the voucher element to the container
                        vouchersContainer.appendChild(voucher);
                    }
                });
            })
            .catch(error => {
                // Display an alert in case of any errors
                alert(error.message);
            });
    </script>

</body>

</html>
